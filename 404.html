<!doctype html>
<html lang="lt">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UMI</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F6F0F5;color:#1B1220;
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
  h1{font-size:20px;margin:0 0 8px}
  p{margin:0;color:#6F6577;font-size:14px}
  a{color:#8C61A4}
</style>
<div id="box"><h1>Ruošiame apmokėjimą</h1><p>Sekundę.</p></div>
<script>
  // GitHub Pages cannot redirect by path, so the short QR code lands here and is
  // sent on from the browser. umimarket.app/p/AB12CD3 is about 25 characters
  // against the 63 of the raw function URL, which makes the QR at a market stall
  // visibly coarser and quicker to scan.
  (function () {
    var m = location.pathname.match(/^\/p\/([A-Za-z0-9]{4,12})\/?$/);
    if (m) {
      location.replace('https://qtzsgjgryfnaayrnaadl.supabase.co/functions/v1/p/' + m[1].toUpperCase());
      return;
    }
    document.getElementById('box').innerHTML =
      '<h1>Puslapis nerastas</h1><p><a href="/">Grįžti į UMI</a></p>';
  })();
</script>
