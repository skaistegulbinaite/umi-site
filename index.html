<!doctype html>
<html lang="lt">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UMI - rankų darbo prekyvietė</title>
<meta name="description" content="UMI - rankų darbo prekyvietė. Viskas čia padaryta žmogaus rankomis. Netrukus.">
<link rel="icon" href="/umi-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light;
    --ground:#F6F0F5; --surface:#FFFFFF; --ink:#1B1220; --muted:#6F6577;
    --faint:#E7DCE7; --accent:#8C61A4; --pop:#2B0E3A; --pink:#FDE4F2; }
  * { box-sizing:border-box }
  html, body { height:100% }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font-family:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; min-height:100%;
  }
  main {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:56px 24px 40px;
  }
  .logo { width:168px; max-width:52vw; height:auto; margin-bottom:34px }
  h1 { font-size:26px; font-weight:700; letter-spacing:-.3px; margin:0 0 10px; line-height:1.25 }
  .lead { font-size:16px; color:var(--muted); margin:0; max-width:400px; line-height:1.6 }
  .soon {
    display:inline-block; margin-top:34px; padding:14px 30px; border-radius:999px;
    background:var(--pop); color:var(--pink);
    font-size:14.5px; font-weight:700; letter-spacing:.3px;
  }
  footer { padding:0 24px 44px; text-align:center; color:var(--muted); font-size:13px; line-height:1.9 }
  footer a { color:var(--accent); text-decoration:none; margin:0 9px; white-space:nowrap }
  footer a:hover { text-decoration:underline }
  .company { margin-top:16px; font-size:12px; color:var(--muted); opacity:.85 }
  @media (min-width:640px) { h1 { font-size:31px } .logo { width:196px } }
</style>
<main>
  <img class="logo" src="/umi-logo.png" alt="UMI">
  <h1>Rankų darbo prekyvietė</h1>
  <p class="lead">Vieta, kurioje viskas padaryta žmogaus rankomis. Be perpardavinėtojų, be fabrikų.</p>
  <span class="soon">Netrukus</span>
</main>
<footer>
  <div>
    <a href="/terms.html">Taisyklės</a>
    <a href="/privacy.html">Privatumas</a>
    <a href="/support.html">Pagalba</a>
    <a href="mailto:info@skaistegulbe.com">info@skaistegulbe.com</a>
  </div>
  <div class="company">MB SGM CREATIVE, įmonės kodas 307583619, Lietuva</div>
</footer>
